name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run ECS
        run: composer ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run PHPStan
        run: composer phpstan

  bc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          fetch-tags: "1"
      - uses: ./.github/actions/setup-php
        with:
          php-version: "8.5"
      # Installed globally on a current PHP so the checker's runtime stays
      # independent of the library's PHP floor; inside require-dev it was stuck
      # on a version whose bundled composer rejects GitHub app tokens (ghs_*).
      - name: Install bc-checker
        run: |
          composer global require roave/backward-compatibility-check:8.21.0 --no-audit
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Run bc-check
        if: github.event_name == 'pull_request' && !contains(github.base_ref, '/feature/')
        run: roave-backward-compatibility-check --format=github-actions --from="origin/${{ github.base_ref }}"
