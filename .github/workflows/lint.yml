name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run ECS
        run: composer ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run PHPStan
        run: composer phpstan

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Cache PayPal OpenAPI specs
        uses: actions/cache@v4
        with:
          path: var/openapi/specs
          key: openapi-specs-${{ hashFiles('tools/openapi/SpecRepository.php') }}
      - name: Check structs against the PayPal OpenAPI specs
        run: composer openapi:check

  bc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          fetch-tags: "1"
      - uses: ./.github/actions/setup-php
        with:
          php-version: "8.5"
      - name: Install bc-checker
        run: |
          composer global require roave/backward-compatibility-check:8.21.0 --no-audit
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Run bc-check
        if: github.event_name == 'pull_request' && !contains(github.base_ref, '/feature/')
        run: roave-backward-compatibility-check --format=github-actions --from="origin/${{ github.base_ref }}"
